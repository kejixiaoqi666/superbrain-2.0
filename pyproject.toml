[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "superbrain2"
version = "0.2.0"
description = "SuperBrain 2.0 — Rust 高性能内核升级版（PyO3 + SIMD + HNSW 向量索引）"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.optional-dependencies]
# 真实 embedding 模型（可插拔）的运行依赖；脱离架构单独安装，默认哈希嵌入无需它们
embedding = ["onnxruntime>=1.16", "tokenizers>=0.15"]

[tool.maturin]
python-source = "python"
module-name = "superbrain2._native"
features = ["extension-module"]
